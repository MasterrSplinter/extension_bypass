name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier que rules.json est à jour (généré depuis blocklists)
        run: npm run check:rules

      - name: Valider les manifests et les règles DNR
        run: npm run validate:manifests

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build (Chrome + Firefox)
        run: npm run build

      - name: Lint web-ext (build Firefox)
        run: npm run lint:webext
