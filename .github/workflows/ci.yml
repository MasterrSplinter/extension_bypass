name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider les manifests et les règles DNR
        run: npm run validate:manifests

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérifier la syntaxe des scripts
        run: node --check src/background/background.js
          && node --check src/content/content.js
          && node --check src/content/main_world.js
          && node --check src/popup/popup.js
          && node --check src/options/options.js
          && node --check src/shared/blocklists.js

      - name: Build de vérification
        run: bash build.sh
