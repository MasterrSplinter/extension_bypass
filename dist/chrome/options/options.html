<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Options - Streaming AdBlocker Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0d0d1a; --bg-secondary: #12122a; --bg-card: #1a1a35;
      --accent: #7c3aed; --accent-light: #a855f7; --accent-glow: rgba(124, 58, 237, 0.35);
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --danger-hover: #dc2626;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: rgba(124, 58, 237, 0.25);
    }
    body {
      background: var(--bg-primary); color: var(--text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
    }
    .container {
      width: 100%; max-width: 600px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .header {
      background: linear-gradient(135deg, #1a0533 0%, #0d0d1a 100%);
      padding: 30px; border-bottom: 1px solid var(--border); text-align: center; position: relative;
    }
    .header::before {
      content: ''; position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 100px; background: var(--accent-glow);
      border-radius: 50%; filter: blur(60px); pointer-events: none;
    }
    .logo {
      font-size: 40px; margin-bottom: 10px; text-shadow: 0 4px 20px var(--accent-glow);
    }
    h1 {
      font-size: 24px; font-weight: 700; margin-bottom: 8px;
      background: linear-gradient(90deg, #f1f5f9, var(--accent-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p.subtitle { color: var(--text-secondary); font-size: 14px; }
    
    .content { padding: 30px; }
    
    .input-group {
      display: flex; gap: 10px; margin-bottom: 30px;
    }
    input[type="text"] {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-primary); padding: 12px 16px; border-radius: 8px; font-size: 14px;
      font-family: 'Inter', sans-serif; transition: border-color 0.3s, box-shadow 0.3s;
    }
    input[type="text"]:focus {
      outline: none; border-color: var(--accent-light); box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
    }
    input[type="text"]::placeholder { color: var(--text-secondary); opacity: 0.7; }
    
    .btn {
      padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6d28d9); color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      transform: translateY(-2px); box-shadow: 0 6px 16px var(--accent-glow);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 8px 12px; font-size: 12px;
    }
    .btn-danger:hover { background: var(--danger); color: white; }

    .domain-list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .domain-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-card); padding: 12px 20px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05); transition: border-color 0.3s;
    }
    .domain-item:hover { border-color: var(--border); }
    .domain-name { font-size: 14px; font-weight: 500; }
    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 14px;
      background: var(--bg-card); border-radius: 8px; border: 1px dashed var(--border);
    }
    
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--bg-card); border: 1px solid var(--success); border-radius: 8px;
      padding: 12px 24px; font-size: 14px; color: var(--success);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛡️</div>
      <h1>Sites Personnalisés</h1>
      <p class="subtitle">Gérez la liste des sites sur lesquels l'extension est active manuellement.</p>
    </div>
    <div class="content">
      <form id="addForm" class="input-group">
        <input type="text" id="domainInput" placeholder="ex: mon-site-streaming.com" required autocomplete="off">
        <button type="submit" class="btn btn-primary">Ajouter</button>
      </form>
      <div id="domainList" class="domain-list">
        <!-- Rempli en JS -->
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="options.js"></script>
</body>
</html>
